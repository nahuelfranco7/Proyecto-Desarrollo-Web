    <section class="container" id="formulario">
    <div class="row" id="modulo_formulario">
        <div class="col-lg-5 col-sm-12" id="info_form">

        <div class="col-lg-5 col-sm-12 offset-lg-2" id="form">
        <h2>Hacé tu consulta</h2>
            
           <form class="row g-3 needs-validation" novalidate>
  <div class="col-md-4">
    <label for="validationCustom01" class="form-label">Nombre</label>
    <input type="text" class="form-control" id="validationCustom01" required>
    <div class="valid-feedback">
      ¡Correcto!
    </div>
      <div class="invalid-feedback">
      ¡Ingresá tu nombre!
      </div>
  </div>
  <div class="col-md-4">
    <label for="validationCustom02" class="form-label">Apellido</label>
    <input type="text" class="form-control" id="validationCustom02" required>
    <div class="valid-feedback">
      ¡Correcto!
    </div>
      <div class="invalid-feedback">
      ¡Ingresá tu apellido!
      </div>
  </div>
  
   <div class="col-md-4">
    <label for="validationCustom02" class="form-label">Correo Electrónico</label>
    <input type="email" class="form-control" id="validationCustom0" value="abc@abc.com" required>
    <div class="valid-feedback">
      ¡Correcto!
    </div>
       <div class="invalid-feedback">
      ¡Ingresá tu correo!
       </div>
  </div>
               
  <div class="col-md-3">
    <label for="validationCustom05" class="form-label">Elegí una carrera</label>
    <select class="form-select" id="validationCustom04" required>
      
                  <option value="1">Profesorado de Inglés</option>
                  <option value="2">Profesorado de Portugués</option>
                  <option value="3">Traductorado de Inglés</option>
                  <option value="4">Traductorado de Portugués</option>
                  <option value="5">Atención a menores en Situación de Riesgo Social</option>
                  <option value="6">Psicopedagogía</option>
                  <option value="7">Relaciones Públicas e Institucionales</option>
                  <option value="8">Gastronomía</option>
                  <option value="9">Periodismo Deportivo</option>
                  <option value="10">Marketing y Publicidad</option>
    </select>
    <div class="invalid-feedback">
      Selecciona una opción.
    </div>
      
  </div>
 <textarea rows="5" placeholder="Consulta" class="form-control"></textarea>
  
  <div class="col-12">
    <button class="btn btn-danger" type="submit">Enviar Consulta</button>
  </div>
</form>
        
        </div>
        </div>    
    </section>
    <script type="text/javascript">// Example starter JavaScript for disabling form submissions if there are invalid fields
(function () {
  'use strict'

  // Fetch all the forms we want to apply custom Bootstrap validation styles to
  var forms = document.querySelectorAll('.needs-validation')

  // Loop over them and prevent submission
  Array.prototype.slice.call(forms)
    .forEach(function (form) {
      form.addEventListener('submit', function (event) {
        if (!form.checkValidity()) {
          event.preventDefault()
          event.stopPropagation()
        }
          
        form.classList.add('was-validated')
      }, false)
    })
})()
    </script>
      
</body>
